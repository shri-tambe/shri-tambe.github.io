<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta name="author" content="Shrikant Tambe">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <button class="theme-toggle" onclick="let d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);localStorage.setItem('theme',t);this.textContent=t==='dark'?'☀️':'🌙'" aria-label="Toggle dark mode">🌙</button>
  <script>let t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);</script>

  <div class="topbar">
    <nav class="nav">
      <a class="brand" href="/">Shrikant Tambe</a>
      <a class="back" href="/">← Home</a>
    </nav>
  </div>

  <main class="wrap">
    <h1>{{ page.title }}</h1>
    <p class="subtitle">{{ page.date | date: "%B %d, %Y" }}</p>
    <article class="post-body">
      {{ content }}
    </article>
  </main>

  <footer>
    <span>&copy; {{ 'now' | date: '%Y' }} Shrikant Tambe</span>
    <span><a href="https://www.linkedin.com/in/shrikanttambe/">LinkedIn</a> · <a href="https://github.com/shri-tambe">GitHub</a> · <a href="https://orcid.org/0009-0003-3432-3852">ORCID</a></span>
  </footer>

  <script>document.querySelector('.theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙'</script>
</body>
</html>
